apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  labels:
    component: mongodb
    project: roboshop
    tier: database
data:
  MONGO: "true" 
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    component: catalogue
    project: roboshop
    tier: app
spec:
  replicas: 1
  #these are the labels replica set use to create pod replicas, this should match pod labels
  selector:
    matchLabels:
      component: catalogue
      project: roboshop
      tier: app
  #this is pod definitionF
  template:
    metadata:
      labels:
        component: catalogue
        project: roboshop
        tier: app
        
    spec:
      containers:
      - name: catalogue
        image: hrushikesh45/catalogue:v1
        envFrom:
          - configMapRef:
              name: catalogue
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:      
    component: catalogue
    project: roboshop
    tier: app
spec:
  selector:
    component: catalogue
    project: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080